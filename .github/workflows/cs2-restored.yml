name: Build restored CS2 DLL
on:
  push:
    branches: [asphyxia-review-2026-11-14]
    paths: ['cs2-restored/**', '.github/workflows/cs2-restored.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Extract sources
        shell: pwsh
        run: Expand-Archive cs2-restored/cs2-restored-source.zip -DestinationPath build-src
      - name: Build x64 Release
        shell: pwsh
        run: msbuild "build-src/cs2-restored/XAnan CG Intern.vcxproj" /m /p:Configuration=Release /p:Platform=x64 /p:OutDir="${{ github.workspace }}\out\" /p:TargetName=cs2-restored /bl:build.binlog
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cs2-restored-x64
          path: |
            out/*
            build.binlog
          if-no-files-found: error
